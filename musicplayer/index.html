const rec={name,ts:Date.now(),cfg:JSON.parse(JSON.stringify(S)),art:IM.art?IM.art.blob:null,artn:IM.art?IM.art.name:'',bgi:IM.bg?IM.bg.blob:null,bgn:IM.bg?IM.bg.name:'',thumb:makeThumb()};
if(CUR.id!=null)rec.id=CUR.id;
try{const id=await tx('readwrite',s=>s.put(rec));CUR.id=id;CUR.name=name;if(MV==mv)mod=false;if(!silent)toast('Template disimpan');return true}
catch(e){if(silent)toast('Auto-save gagal');else dlg('Gagal menyimpan','Penyimpanan penuh atau tidak tersedia. Gambar yang terlalu besar bisa menjadi penyebabnya.');return false}}

async function tryLeave(fromPop){const keep=()=>{if(fromPop){try{history.pushState({mps:1},'');HIST=true}catch(e){}}};

leaveEdit()}

/* export / import .mptemplate */
const imgType=m=>/^image\/(png|jpeg|webp)$/.test(m.blob.type)?m.blob.type:/\.jpe?g$/i.test(m.name)?'image/jpeg':/\.webp$/i.test(m.name)?'image/webp':'image/png';
async function exportTpl(){if(EXP)return busy();
try{const asset=async m=>m?{name:m.name,type:imgType(m),data:await blobToData(new Blob([m.blob],{type:imgType(m)}))}:null;
const pack={app:'Music Player Studio',format:'mptemplate',version:1,name:(CUR.name||'').trim()||'Template',created:new Date().toISOString(),cfg:JSON.parse(JSON.stringify(S)),assets:{art:await asset(IM.art),bg:await asset(IM.bg)}};
saveBlob(new Blob([JSON.stringify(pack)],{type:'application/octet-stream'}),safeName(pack.name)+'.mptemplate');toast('Template diekspor')}
catch(e){dlg('Gagal mengekspor','Template tidak bisa dijadikan file. Coba lagi.')}}
async function importTpl(file){if(EXP)return busy();
if(file.size>250*1048576)return dlg('File terlalu besar','File lebih dari 250 MB tidak dapat diimpor.');
let pack;try{pack=JSON.parse(await file.text())}catch(e){return dlg('Template tidak valid','File ini bukan template Music Player Studio yang benar.')}
if(!pack||typeof pack!='object'||pack.format!='mptemplate'||!pack.cfg||typeof pack.cfg!='object'||Array.isArray(pack.cfg))return dlg('Template tidak valid','Isi file tidak sesuai format .mptemplate.');
if(!(+pack.version>=1)||+pack.version>1)return dlg('Versi tidak didukung','Template ini dibuat dengan versi aplikasi yang tidak dikenali.');
const cfg=fixCfg(mergeSafe(DEF(),pack.cfg));
const asset=async a=>{if(!a)return null;if(typeof a!='object'||typeof a.data!='string'||!/^data:image\/(png|jpeg|webp);base64,/i.test(a.data))throw new Error('asset');const b=dataToBlob(a.data);return loadImgFile(new File([b],String(a.name||'gambar').slice(0,100),{type:b.type}))};
let ia=null,ib=null;try{const as=pack.assets||{};ia=await asset(as.art);ib=await asset(as.bg)}catch(e){return dlg('Gambar template rusak','Artwork atau background di dalam file tidak bisa dibaca. Template tidak diimpor.')}
const name=(typeof pack.name=='string'&&pack.name.trim()?pack.name.trim():'Template Impor').slice(0,60);
const rec={name,ts:Date.now(),cfg,art:ia?ia.blob:null,artn:ia?ia.name:'',bgi:ib?ib.blob:null,bgn:ib?ib.name:'',thumb:thumbWith(cfg,ia,ib)};
try{await tx('readwrite',s=>s.add(rec))}catch(e){return dlg('Gagal menyimpan','Template valid tetapi tidak bisa disimpan. Penyimpanan perangkat mungkin penuh.')}
toast('Template diimpor ke galeri: '+name);if(MODE=='home')renderHome()}
