const H="const canvas = document.getElementById('canvas');\nconst ctx = canvas.getContext('2d');\n";

["Bouncing Ball",H+`let y=100,vy=0,last=0,hue=0;
function frame(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  const W=canvas.width,H=canvas.height,r=H*.06;
  vy+=H*2.2*dt;y+=vy*dt;
  if(y>H-r){y=H-r;vy=-vy*.92;hue=(hue+40)%360}
  ctx.fillStyle='#111827';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='hsl('+hue+',80%,60%)';
  ctx.beginPath();ctx.arc(W/2+Math.sin(t/900)*W*.3,y,r,0,Math.PI*2);ctx.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`],
["Loading Animation",H+`function frame(t){
  const W=canvas.width,H=canvas.height,n=12,R=H*.14;
  ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2,k=((t/1000*2-i/n)%1+1)%1;
    ctx.fillStyle='rgba(125,211,252,'+(1-k)+')';
    ctx.beginPath();ctx.arc(W/2+Math.cos(a)*R,H/2+Math.sin(a)*R,H*.025*(1.4-k*.6),0,7);ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`],
["Particle System",H+`const P=[];let last=0;
function frame(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  const W=canvas.width,H=canvas.height;
  for(let i=0;i<6;i++)P.push({x:W/2,y:H*.85,vx:(Math.random()-.5)*W*.5,vy:-H*(.6+Math.random()*.6),l:1});
  ctx.fillStyle='rgba(8,10,20,.35)';ctx.fillRect(0,0,W,H);
  for(const p of P){p.vy+=H*.9*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*.5;
    ctx.fillStyle='hsla('+(20+p.l*40)+',100%,60%,'+Math.max(p.l,0)+')';
    ctx.beginPath();ctx.arc(p.x,p.y,H*.008,0,7);ctx.fill()}
  while(P.length&&P[0].l<=0)P.shift();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`],
["Wave Animation",H+`function frame(t){
  const W=canvas.width,H=canvas.height;
  ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
  for(let k=0;k<4;k++){
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=4)ctx.lineTo(x,H*(.5+k*.08)+Math.sin(x/(W*.08)+t/700*(1+k*.3))*H*.06);
    ctx.lineTo(W,H);ctx.closePath();
    ctx.fillStyle='rgba(56,189,248,'+(.25+k*.12)+')';ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`],
["Rotating Shapes",H+`function frame(t){
  const W=canvas.width,H=canvas.height;
  ctx.fillStyle='#14110f';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(W/2,H/2);
  for(let i=0;i<8;i++){
    ctx.save();ctx.rotate(t/1000*(i%2?1:-1)*.6+i*.3);
    const s=H*(.08+i*.045);
    ctx.strokeStyle='hsl('+(i*40+t/20)+',80%,60%)';ctx.lineWidth=4;
    ctx.strokeRect(-s/2,-s/2,s,s);ctx.restore();
  }
  ctx.restore();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`],
["Text Animation",H+`const text='MotionLab JS';
function frame(t){
  const W=canvas.width,H=canvas.height,fs=H*.14;
  ctx.fillStyle='#10131a';ctx.fillRect(0,0,W,H);
  ctx.font='700 '+fs+'px sans-serif';ctx.textBaseline='middle';
  const w=ctx.measureText(text).width;let x=(W-w)/2;
  for(let i=0;i<text.length;i++){
    const c=text[i],cw=ctx.measureText(c).width;
    ctx.fillStyle='hsl('+(i*30+t/15)+',85%,65%)';
    ctx.fillText(c,x,H/2+Math.sin(t/300+i*.6)*fs*.4);x+=cw;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`],
["Moving Background",H+`const S=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),z:.2+Math.random()}));
function frame(t){
  const W=canvas.width,H=canvas.height;
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'hsl('+(t/60%360)+',60%,15%)');g.addColorStop(1,'hsl('+((t/60+80)%360)+',60%,25%)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(const s of S){s.x=(s.x-s.z*.002+1)%1;ctx.globalAlpha=s.z;ctx.fillRect(s.x*W,s.y*H,s.z*4,s.z*4)}
  ctx.globalAlpha=1;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`],
["Geometric Animation",H+`function frame(t){
  const W=canvas.width,H=canvas.height;
  ctx.fillStyle='#0d0f14';ctx.fillRect(0,0,W,H);
  ctx.translate(W/2,H/2);
  for(let k=3;k<=9;k++){
    ctx.beginPath();
    for(let i=0;i<=k;i++){const a=i/k*Math.PI*2+t/1000*(k%2?.5:-.5),r=H*.04*k;
      i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}
    ctx.strokeStyle='hsl('+(k*40)+',80%,65%)';ctx.lineWidth=3;ctx.stroke();
  }
  ctx.setTransform(1,0,0,1,0,0);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);`]];
